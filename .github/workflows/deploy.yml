name: OIDC AWS Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::513483285867:role/GitHubOIDCRole
          aws-region: us-east-1

      - name: Verify Identity
        run: aws sts get-caller-identity

      - name: Upload to S3
        run: aws s3 cp index.html s3://preethi-oidc-demo-bucket/